<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activa tu cuenta de Ruta del Cacao</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #1f2a1f;">
    <p>Hola,</p>
    <p>
      Te crearon una cuenta en Ruta del Cacao. El enlace vence en {{ hours }} horas y solo
      sirve una vez.
    </p>
    <p><a href="{{ activation_url }}">Elegir mi contraseña</a></p>
    <p>
      Si el botón no funciona, copia esta dirección en tu navegador:<br />
      <a href="{{ activation_url }}">{{ activation_url }}</a>
    </p>
    <p>Si no esperabas este correo, puedes ignorarlo: la cuenta sigue sin activar.</p>
  </body>
</html>
